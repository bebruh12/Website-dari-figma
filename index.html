<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Encyclopedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style1.css">
</head>
<body>

    <header class="header-section text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <img src="lo.jpeg" alt="PL Logo" class="pl-logo">
                <span class="fw-bold fs-5">Premier League</span>
            </div>
            <nav class="d-flex gap-4 align-items-center">
                <a href="#" class="nav-link active">HOME</a>
                <a href="#" class="nav-link">AI ENCYCLOPEDIA</a>
                <button class="btn btn-explore rounded-pill px-4">EXPLORE NOW</button>
            </nav>
        </div>
    </header>

    <main class="container my-5 text-white">
        <div class="row g-4">
            <div class="col-lg-7">
                <h1 class="display-5 fw-bold mb-4 header-title">Premier League<br><span class="text-purple-light">Encyclopedia</span></h1>
                
                <div class="row g-3">
                    <div class="col-md-5">
                        <div class="img-card text-center">
                            <img src="tro.jpeg" alt="Premier League Trophy" class="img-fluid rounded-3 macro-img">
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="img-card">
                            <img src="o.jpg" alt="Winners Collage" class="img-fluid rounded-3 collage-img">
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="table-container p-4 rounded-4">
                    <h3 class="fs-4 fw-bold mb-4 text-center text-uppercase tracking-wide">Klasemen 2024/25</h3>
                    <div class="table-responsive">
                        <table class="table table-dark table-borderless align-middle text-center klasemen-table">
                            <thead>
                                <tr>
                                    <th class="text-start">NO CLUB</th>
                                    <th>MATCH</th>
                                    <th>POINT</th>
                                    <th>MENANG</th>
                                    <th>SERI</th>
                                    <th>KALAH</th>
                                    <th>GM</th>
                                    <th>GK</th>
                                    <th>SG</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="rank-1">
                                    <td class="text-start fw-bold"><span class="num-badge">1</span> LIVERPOOL</td>
                                    <td>38</td><td>84</td><td>25</td><td>9</td><td>4</td><td>86</td><td>41</td><td>45</td>
                                </tr>
                                <tr>
                                    <td class="text-start fw-bold"><span class="num-badge">2</span> ARSENAL</td>
                                    <td>38</td><td>74</td><td>18</td><td>14</td><td>4</td><td>69</td><td>34</td><td>45</td>
                                </tr>
                                <tr>
                                    <td class="text-start fw-bold"><span class="num-badge">3</span> CITY</td>
                                    <td>38</td><td>71</td><td>25</td><td>8</td><td>9</td><td>72</td><td>44</td><td>45</td>
                                </tr>
                                <tr>
                                    <td class="text-start fw-bold"><span class="num-badge">4</span> CHELSEA</td>
                                    <td>38</td><td>69</td><td>25</td><td>9</td><td>9</td><td>64</td><td>43</td><td>45</td>
                                </tr>
                                <tr>
                                    <td class="text-start fw-bold"><span class="num-badge">5</span> NEWCASTLE</td>
                                    <td>38</td><td>66</td><td>6</td><td>9</td><td>12</td><td>68</td><td>47</td><td>45</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
