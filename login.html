<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Premier League Encyclopedia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style_login.css?v=4.0">
</head>
<body>

    <div class="login-container-green">
        <div class="top-badge-login">Login Page</div>
        
        <div class="login-content-body">
            <div class="text-center mb-4">
                <img src="lo.jpeg" alt="Logo" class="img-fluid" style="height: 70px; object-fit: contain;">
            </div>
            
            <form>
                <div class="mb-3">
                    <label class="form-label fw-bold text-purple">Email/Username</label>
                    <input type="text" class="form-control custom-input-fields" autocomplete="off">
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold text-purple">Password</label>
                    <input type="password" class="form-control custom-input-fields">
                </div>
                
                <div class="text-center mb-4">
                    <a href="#" class="register-link-text">Blom punya akun? Daftar dulu sini</a>
                </div>
                
                <button type="submit" class="btn btn-login-submit w-100 fw-bold">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
