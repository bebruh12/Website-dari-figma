<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Premier League</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="family">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container-fluid login-container p-0">
        <div class="row g-0 h-100">
            
            <div class="col-md-4 col-12 login-sidebar d-flex flex-column align-items-center justify-content-center px-4 py-5">
                
                <div class="top-badge mb-4">Login Page</div>
                
                <div class="logo-wrapper mb-5 text-center">
                    <img src="logo-pl.png" alt="Premier League Logo" class="img-fluid logo-img">
                </div>
                
                <form class="w-100 px-2">
                    <div class="mb-3">
                        <label for="username" class="form-label custom-label">Email/Username</label>
                        <input type="text" class="form-control custom-input" id="username" autocomplete="off">
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label custom-label">Password</label>
                        <input type="password" class="form-control custom-input" id="password">
                    </div>
                    
                    <div class="text-center mb-4">
                        <a href="#" class="register-link">Blom punya akun? Daftar dulu sini</a>
                    </div>
                    
                    <button type="submit" class="btn btn-login w-100">Login</button>
                </form>
                
            </div>
            
            <div class="col-md-8 d-none d-md-block banner-image-section">
                </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
