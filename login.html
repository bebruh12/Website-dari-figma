<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

    <div class="outer-wrapper">
        <div class="container-fluid h-100 p-0">
            <div class="row g-0 h-100">
                
                <div class="col-lg-4 col-md-5 login-sidebar d-flex flex-column justify-content-between">
                    
                    <div class="top-badge text-center">
                        <span class="badge-title">Login Page</span>
                    </div>

                    <div class="form-container">
                        <div class="logo-wrapper text-center">
                            <img src="logo-pl.png" alt="Premier League Logo" class="img-fluid main-logo">
                        </div>

                        <form id="loginForm" onsubmit="executeLogin(event)">
                            <div class="mb-3">
                                <label for="username" class="form-label custom-label">Email/Username</label>
                                <input type="text" class="form-control custom-input" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label custom-label">Password</label>
                                <input type="password" class="form-control custom-input" id="password" required>
                            </div>
                          

                            <div class="text-center">
                                <button type="submit" class="btn btn-login w-100">Login</button>
                            </div>
                        </form>
                    </div>

                    <div class="bottom-spacer"></div>
                </div>

                <div class="col-lg-8 col-md-7 stadium-banner">
                    </div>

            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
