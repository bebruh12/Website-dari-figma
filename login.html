<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League - Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="loginstyle.css">
</head>
<body>

    <div class="outer-wrapper">
        <div class="main-container">
            <div class="row g-0 h-100">
                
                <div class="col-12 col-md-4 h-100">
                    <div class="login-panel">
                        
                        <div class="top-banner">
                            Login Page
                        </div>
                        
                        <div class="logo-container">
                            <img src="logo-pl.png" alt="Premier League Logo" class="logo-placeholder" onerror="this.style.display='none'; this.after('[ LOGO PREMIER LEAGUE ]')">
                        </div>
                        
                        <div class="form-container">
                            <form action="#" method="POST" onsubmit="return false;">
                                
                                <label class="form-label-custom">Email/Username</label>
                                <input type="text" class="form-control-custom" required>
                                
                                <label class="form-label-custom">Password</label>
                                <input type="password" class="form-control-custom" required>
                                
                                <a href="#" class="register-link">Blom punya akun? Daftar dulu sini</a>
                                
                                <button type="submit" class="btn-login">Login</button>
                                
                            </form>
                        </div>
                        
                    </div>
                </div>
                
                <div class="col-12 col-md-8 h-100 d-none d-md-block">
                    <div class="stadium-panel">
                        <img src="stadium.jpg" alt="Stadium Background" class="stadium-img" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1200';">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
