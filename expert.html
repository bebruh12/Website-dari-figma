<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Encyclopedia - AI Expert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <nav class="navbar navbar-expand navbar-dark custom-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="lo.jpeg" alt="Logo" class="me-2" style="height: 30px;">
                <span class="fw-bold fs-6">Premier League</span>
            </a>
            <div class="navbar-nav ms-5">
                <a class="nav-link text-white-50 fw-semibold" href="index.html">HOME</a>
                <a class="nav-link active me-4 text-white fw-semibold" href="ai-encyclopedia.html">AI ENCYCLOPEDIA</a>
            </div>
        </div>
    </nav>

    <div class="green-bar"></div>

    <div class="container-fluid px-4 my-5">
        <div class="row">
            <div class="col-lg-8 col-md-7 mb-4">
                <h1 class="main-title mb-4">Premier League<br>Encyclopedia</h1>
                <button class="btn btn-explore mb-5">EXPLORE NOW</button>
                
                <div class="chat-section mb-4">
                    <h3 class="section-label mb-3">Tanya sekarang</h3>
                    <div class="green-box-input">
                        <textarea class="form-control blank-textarea" placeholder="Ketik pertanyaanmu di sini..."></textarea>
                    </div>
                </div>

                <div class="chat-section">
                    <h3 class="section-label mb-3 ai-label d-flex align-items-center">
                        <i class="fa-solid fa-sparkles me-2"></i> EPL Expert Answer
                    </h3>
                    <div class="green-box-output">
                        <p class="output-placeholder-text">Jawaban analisis AI akan muncul di sini...</p>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4 col-md-5 mb-4 d-flex flex-column gap-4 align-items-start fixed-visuals">
                <div class="visual-item-trophy">
                    <img src="tro.jpeg" alt="Piala Liga Premier" class="img-fluid rounded shadow w-100 image-fit-trophy">
                </div>
                <div class="visual-item-collage">
                    <img src="o.jpg" alt="Kolase Perayaan Juara" class="img-fluid rounded shadow w-100 image-fit-collage">
                </div>
            </div>
        </div>
    </div>

</body>

</html>
