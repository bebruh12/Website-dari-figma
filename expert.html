<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Encyclopedia - AI Expert</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style2.css?v=3.0">
</head>
<body>

    <nav class="navbar navbar-dark custom-navbar">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between flex-nowrap">
            
            <div class="d-flex align-items-center flex-nowrap">
                <a class="navbar-brand d-flex align-items-center m-0 me-4" href="#">
                    <img src="lo.jpeg" alt="Logo" class="me-2" style="height: 30px;">
                    <span class="fw-bold fs-6">Premier League</span>
                </a>
                
                <div class="d-flex align-items-center gap-4">
                    <a class="text-white-50 fw-semibold text-decoration-none" href="index.html" style="font-size: 0.9rem; letter-spacing: 0.5px;">HOME</a>
                    <a class="text-white fw-semibold text-decoration-none" href="expert.html" style="font-size: 0.9rem; letter-spacing: 0.5px;">AI ENCYCLOPEDIA</a>
                </div>
            </div>

            <div>
                <a href="login.html" class="btn btn-nav-login fw-bold">LOGIN</a>
            </div>

        </div>
    </nav>

    <div class="green-bar"></div>

    <div class="container-fluid px-4 my-5">
        <div class="row">
            
            <div class="col-lg-8 col-md-7 mb-4">
                <h1 class="main-title mb-4">Premier League<br>Encyclopedia</h1>
                <button type="button" id="btn-submit" class="btn btn-explore mb-5">EXPLORE NOW</button>
                
                <div class="chat-section mb-4">
                    <h3 class="section-label mb-3">Tanya EPL Expert</h3>
                    
                    <div class="green-box-input mb-3">
                        <textarea id="user-input" class="form-control blank-textarea" placeholder="Ketik pertanyaanmu di sini... (contoh: juara, top skor, piala)"></textarea>
                    </div>

                    <div class="green-box-output">
                        <p id="ai-output" class="output-placeholder-text">Jawaban analisis AI akan muncul di sini setelah kamu klik EXPLORE NOW...</p>
                    </div>
                </div>
            </div> 
            
            <div class="col-lg-4 col-md-5 mb-4 d-flex flex-column gap-4 align-items-start fixed-visuals">
                <div class="visual-item-trophy w-100">
                    <img src="tro.jpeg" alt="Piala Liga Premier" class="img-fluid rounded shadow w-100 image-fit-trophy">
                </div>
                <div class="visual-item-collage w-100">
                    <img src="o.jpg" alt="Kolase Perayaan Juara" class="img-fluid rounded shadow w-100 image-fit-collage">
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
