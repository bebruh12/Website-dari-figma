<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPL Expert Answer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <header class="header-section text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-3">
                <img src="lo.jpeg" alt="PL Logo" class="pl-logo">
                <span class="fw-bold fs-5">Premier League</span>
            </div>
            <nav class="d-flex gap-4 align-items-center">
                <a href="index.html" class="nav-link">HOME</a>
                <a href="#" class="nav-link active">AI ENCYCLOPEDIA</a>
                <button class="btn btn-explore rounded-pill px-4">EXPLORE NOW</button>
            </nav>
        </div>
    </header>

    <main class="container my-5 text-white">
        <div class="row g-4 align-items-center">
            <div class="col-lg-6">
                <h1 class="display-4 fw-bold mb-3 header-title">Premier League</h1>
                <p class="text-muted-purple mb-4 lead">Dapatkan analisis mendalam langsung dari asisten ahli berbasis kecerdasan buatan kami.</p>
                
                <div class="row g-3">
                    <div class="col-sm-6">
                        <img src="tro.jpeg" alt="Trophy View" class="img-fluid rounded-4 side-img">
                    </div>
                    <div class="col-sm-6">
                        <img src="li.jpg" alt="Liverpool Champions" class="img-fluid rounded-4 side-img">
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="expert-card p-4 p-md-5 rounded-4">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <span class="badge bg-purple-accent px-3 py-2 rounded-pill fs-6">EPL Expert Answer</span>
                        <div class="page-number fw-bold fs-4">02</div>
                    </div>
                    
                    <h2 class="fw-bold mb-4 text-gradient">Tanya sekarang mengenai data Premier League</h2>
                    
                    <div class="input-group-custom p-3 rounded-3 mb-4">
                        <p class="mb-0 text-white-50 small">Rekomendasi pertanyaan:</p>
                        <p class="fw-semibold mb-0 text-cyan">"Siapakah pencetak gol terbanyak sepanjang masa Premier League?"</p>
                    </div>

                    <div class="d-grid">
                        <button class="btn btn-ask py-3 rounded-3 fw-bold fs-5">Mulai Bertanya</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
